<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 220" width="1200" height="220" role="img" aria-label="Ragesh P — Building AI that ships, not just demos."><title>Ragesh P — Building AI that ships, not just demos.</title><style>
.fade{animation:fade 1.1s ease-out backwards}
@keyframes fade{from{opacity:0}to{opacity:1}}
.card{animation:glowb 5s ease-in-out infinite}
@keyframes glowb{0%,100%{stroke:#1E3A7A;stroke-opacity:.85}50%{stroke:#5B9BFF;stroke-opacity:1}}
.pulse{animation:pulse 3s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}
.float{animation:float 4s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
.spin{animation:spin 28s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes spin{to{transform:rotate(360deg)}}
.tw{animation:tw 3s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.08}50%{opacity:.95}}
.shine{transform:translateX(-400px);animation:shine 8s ease-in-out infinite}
@keyframes shine{0%{transform:translateX(-300px)}55%,100%{transform:translateX(1500px)}}
.blink{animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.ecg{stroke-dasharray:90 260;animation:ecg 2.6s linear infinite}
@keyframes ecg{from{stroke-dashoffset:350}to{stroke-dashoffset:0}}
.line{animation:lineIn .6s ease-out backwards}
@keyframes lineIn{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:translateX(0)}}
</style><defs>
<linearGradient id="bgf" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#060B18"/><stop offset="1" stop-color="#0B1530"/></linearGradient>
<linearGradient id="acf" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2F6BFF"/><stop offset="1" stop-color="#A9C7FF"/></linearGradient>
<radialGradient id="glf" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#2F6BFF" stop-opacity="0.45"/><stop offset="1" stop-color="#2F6BFF" stop-opacity="0"/></radialGradient>
<pattern id="dtf" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#5B9BFF" fill-opacity="0.16"/></pattern>
<filter id="gwf" x="-30%" y="-40%" width="160%" height="180%"><feGaussianBlur stdDeviation="4" result="b"><animate attributeName="stdDeviation" values="2;6;2" dur="3.5s" repeatCount="indefinite"/></feGaussianBlur><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<linearGradient id="shf" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#9CC4FF" stop-opacity="0"/><stop offset="0.5" stop-color="#9CC4FF" stop-opacity="0.13"/><stop offset="1" stop-color="#9CC4FF" stop-opacity="0"/></linearGradient>
<clipPath id="clf"><rect width="1200" height="220" rx="22"/></clipPath></defs><rect width="1200" height="220" rx="22" fill="url(#bgf)"/><rect width="1200" height="220" rx="22" fill="url(#dtf)"/><g class="fade"><circle cx="600" cy="110" r="200" fill="url(#glf)" class="pulse"/><text x="600" y="100" font-family="Georgia,'Times New Roman',serif" font-size="56" font-weight="700" fill="#EAF2FF" text-anchor="middle" letter-spacing="-1" filter="url(#gwf)">Ragesh P</text><text x="600" y="144" font-family="Georgia,'Times New Roman',serif" font-size="22" font-weight="400" fill="#A9C7FF" text-anchor="middle" font-style="italic">Building AI that ships, not just demos.</text><text x="600" y="184" font-family="'SF Mono',Consolas,'Courier New',monospace" font-size="14" font-weight="400" fill="#8DA2C8" text-anchor="middle" >ragesh.in   ·   github.com/MrRagesh   ·   linkedin.com/in/ragesh1208</text><path d="M40 200 L300 200 L330 178 L355 214 L380 190 L410 200 L1160 200" fill="none" stroke="#5B9BFF" stroke-opacity=".22" stroke-width="2"/><path class="ecg" d="M40 200 L300 200 L330 178 L355 214 L380 190 L410 200 L1160 200" fill="none" stroke="#5B9BFF" stroke-width="2" filter="url(#gwf)"/><rect x="0" y="214" width="1200" height="6" rx="3" fill="url(#acf)" class="pulse"/></g><g clip-path="url(#clf)"><polygon class="shine" points="40,0 200,0 160,220 0,220" fill="url(#shf)"/></g><rect x="1" y="1" width="1198" height="218" rx="21" fill="none" stroke="#5B9BFF" stroke-width="1.5" class="pulse"/></svg>