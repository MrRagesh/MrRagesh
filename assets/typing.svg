<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 96" width="1200" height="96" role="img" aria-label="Typing banner cycling: AI Application Developer, Full-Stack Developer, Gemini API and prompt engineering, Python SQL Pandas, open to internships."><title>Typing banner cycling: AI Application Developer, Full-Stack Developer, Gemini API and prompt engineering, Python SQL Pandas, open to internships.</title><style>
.fade{animation:fade 1.1s ease-out backwards}
