<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-label="SimplifyED: full-stack AI educational platform with Gemini-powered tutoring chat and automated quiz generation, estimated 70% less quiz-creation effort. TypeScript, React, Node.js, Gemini API."><title>SimplifyED: full-stack AI educational platform with Gemini-powered tutoring chat and automated quiz generation, estimated 70% less quiz-creation effort. TypeScript, React, Node.js, Gemini API.</title><style>
.fade{animation:fade 1.1s ease-out backwards}
@keyframes fade{from{opacity:0}to{opacity:1}}
.card{animation:glowb 5s ease-in-out infinite}
@keyframes glowb{0%,100%{stroke:#1E3A7A;stroke-opacity:.85}50%{stroke:#5B9BFF;stroke-opacity:1}}
.pulse{animation:pulse 3s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}
.float{animation:float 4s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
.spin{animation:spin 28s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes spin{to{transform:rotate(360deg)}}
.tw{animation:tw 3s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.08}50%{opacity:.95}}
.shine{transform:translateX(-400px);animation:shine 8s ease-in-out infinite}
@keyframes shine{0%{transform:translateX(-300px)}55%,100%{transform:translateX(1500px)}}
.blink{animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.ecg{stroke-dasharray:90 260;animation:ecg 2.6s linear infinite}
@keyframes ecg{from{stroke-dashoffset:350}to{stroke-dashoffset:0}}
.line{animation:lineIn .6s ease-out backwards}
@keyframes lineIn{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:translateX(0)}}
</style><defs>
<linearGradient id="bgp" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#060B18"/><stop offset="1" stop-color="#0B1530"/></linearGradient>
<linearGradient id="acp" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2F6BFF"/><stop offset="1" stop-color="#A9C7FF"/></linearGradient>
<radialGradient id="glp" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#2F6BFF" stop-opacity="0.45"/><stop offset="1" stop-color="#2F6BFF" stop-opacity="0"/></radialGradient>
<pattern id="dtp" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#5B9BFF" fill-opacity="0.16"/></pattern>
<filter id="gwp" x="-30%" y="-40%" width="160%" height="180%"><feGaussianBlur stdDeviation="4" result="b"><animate attributeName="stdDeviation" values="2;6;2" dur="3.5s" repeatCount="indefinite"/></feGaussianBlur><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<linearGradient id="shp" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#9CC4FF" stop-opacity="0"/><stop offset="0.5" stop-color="#9CC4FF" stop-opacity="0.13"/><stop offset="1" stop-color="#9CC4FF" stop-opacity="0"/></linearGradient>
<clipPath id="clp"><rect width="1200" height="360" rx="22"/></clipPath></defs><rect width="1200" height="360" rx="22" fill="url(#bgp)"/><rect width="1200" height="360" rx="22" fill="url(#dtp)"/><g class="fade"><text x="60" y="56" font-family="'SF Mono',Consolas,'Courier New',monospace" font-size="13" font-weight="600" fill="#5B9BFF" text-anchor="start" letter-spacing="3">PROJECT 01</text><text x="58" y="106" font-family="Georgia,'Times New Roman',serif" font-size="44" font-weight="700" fill="#EAF2FF" text-anchor="start" letter-spacing="-0.5">SimplifyED</text><text x="60" y="146" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="18" font-weight="400" fill="#A9C7FF" text-anchor="start" >Full-stack AI educational platform: interactive AI tutoring chat and</text><text x="60" y="174" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="18" font-weight="400" fill="#A9C7FF" text-anchor="start" >automated quiz generation for students and educators.</text><rect x="60" y="212" width="340" height="74" rx="14" fill="#0F1D3F" stroke="#1E3A7A" class="card" style="animation-delay:0.5s"/><text x="80" y="244" font-family="Georgia,'Times New Roman',serif" font-size="20" font-weight="700" fill="#EAF2FF" text-anchor="start" >~70% less effort</text><text x="80" y="268" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="400" fill="#8DA2C8" text-anchor="start" >estimated cut in quiz-creation work</text><rect x="420" y="212" width="340" height="74" rx="14" fill="#0F1D3F" stroke="#1E3A7A" class="card" style="animation-delay:1.0s"/><text x="440" y="244" font-family="Georgia,'Times New Roman',serif" font-size="20" font-weight="700" fill="#EAF2FF" text-anchor="start" >Gemini API prompts</text><text x="440" y="268" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="400" fill="#8DA2C8" text-anchor="start" >quiz generation + AI tutoring chat</text><rect x="780" y="212" width="340" height="74" rx="14" fill="#0F1D3F" stroke="#1E3A7A" class="card" style="animation-delay:1.5s"/><text x="800" y="244" font-family="Georgia,'Times New Roman',serif" font-size="20" font-weight="700" fill="#EAF2FF" text-anchor="start" >Full API layer</text><text x="800" y="268" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="400" fill="#8DA2C8" text-anchor="start" >quiz engine ↔ database ↔ React UI</text><rect x="60" y="306" width="102" height="30" rx="15" fill="#0F1D3F" stroke="#1E3A7A" class="card" style="animation-delay:2.0s"/><text x="111.0" y="326" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="600" fill="#A9C7FF" text-anchor="middle" >TypeScript</text><rect x="172" y="306" width="64" height="30" rx="15" fill="#0F1D3F" stroke="#1E3A7A" class="card" style="animation-delay:2.5s"/><text x="204.0" y="326" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="600" fill="#A9C7FF" text-anchor="middle" >React</text><rect x="246" y="306" width="79" height="30" rx="15" fill="#0F1D3F" stroke="#1E3A7A" class="card" style="animation-delay:0.0s"/><text x="285.5" y="326" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="600" fill="#A9C7FF" text-anchor="middle" >Node.js</text><rect x="335" y="306" width="102" height="30" rx="15" fill="#0F1D3F" stroke="#1E3A7A" class="card" style="animation-delay:0.5s"/><text x="386.0" y="326" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="600" fill="#A9C7FF" text-anchor="middle" >Gemini API</text><rect x="447" y="306" width="86" height="30" rx="15" fill="#0F1D3F" stroke="#1E3A7A" class="card" style="animation-delay:1.0s"/><text x="490.0" y="326" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="600" fill="#A9C7FF" text-anchor="middle" >Database</text><rect x="1180" y="40" width="6" height="280" rx="3" fill="url(#acp)" opacity="0.0"/></g><g clip-path="url(#clp)"><polygon class="shine" points="40,0 200,0 160,360 0,360" fill="url(#shp)"/></g><rect x="1" y="1" width="1198" height="358" rx="21" fill="none" stroke="#5B9BFF" stroke-width="1.5" class="pulse"/></svg>