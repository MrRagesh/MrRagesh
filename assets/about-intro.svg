="152" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="400" fill="#8DA2C8" text-anchor="middle" >LLM products</text><text x="1088" y="169" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="400" fill="#8DA2C8" text-anchor="middle" >shipped</text><rect x="870" y="210" width="136" height="150" rx="16" fill="#0F1D3F" stroke="#1E3A7A" class="card" style="animation-delay:0.5s"/><text x="938" y="280" font-family="Georgia,'Times New Roman',serif" font-size="40" font-weight="700" fill="#EAF2FF" text-anchor="middle" >43</text><rect x="918" y="294" width="40" height="3" rx="1.5" fill="url(#aca)"/><text x="938" y="322" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="400" fill="#8DA2C8" text-anchor="middle" >public</text><text x="938" y="339" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="400" fill="#8DA2C8" text-anchor="middle" >GitHub repos</text><rect x="1020" y="210" width="136" height="150" rx="16" fill="#0F1D3F" stroke="#1E3A7A" class="card" style="animation-delay:1.0s"/><text x="1088" y="280" font-family="Georgia,'Times New Roman',serif" font-size="40" font-weight="700" fill="#EAF2FF" text-anchor="middle" >2027</text><rect x="1068" y="294" width="40" height="3" rx="1.5" fill="url(#aca)"/><text x="1088" y="322" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="400" fill="#8DA2C8" text-anchor="middle" >graduation</text><text x="1088" y="339" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="400" fill="#8DA2C8" text-anchor="middle" >year</text></g><g clip-path="url(#cla)"><polygon class="shine" points="40,0 200,0 160,400 0,400" fill="url(#sha)"/></g><rect x="1" y="1" width="1198" height="398" rx="21" fill="none" stroke="#5B9BFF" stroke-width="1.5" class="pulse"/></svg>