<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-label="About: AI Application Developer and Full-Stack Developer. B.Tech Honours IT at M.A.M College of Engineering and Technology, CGPA 8.27. Built and deployed two LLM-powered products on Gemini API and Google Cloud. 43 public repositories. Graduating 2027."><title>About: AI Application Developer and Full-Stack Developer. B.Tech Honours IT at M.A.M College of Engineering and Technology, CGPA 8.27. Built and deployed two LLM-powered products on Gemini API and Google Cloud. 43 public repositories. Graduating 2027.</title><style>
.fade{animation:fade 1.1s ease-out backwards}
@keyframes fade{from{opacity:0}to{opacity:1}}
.card{animation:glowb 5s ease-in-out infinite}
@keyframes glowb{0%,100%{stroke:#1E3A7A;stroke-opacity:.85}50%{stroke:#5B9BFF;stroke-opacity:1}}
