<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-label="RescueLens-AI: multimodal assistant turning live camera and voice into guidance with Gemini 1.5 Pro, deployed on Google Cloud for the Google AI Hackathon."><title>RescueLens-AI: multimodal assistant turning live camera and voice into guidance with Gemini 1.5 Pro, deployed on Google Cloud for the Google AI Hackathon.</title><defs>
