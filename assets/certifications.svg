<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" width="1200" height="330" role="img" aria-label="Certifications: GUVI Python Zero to Hero, Generative AI, AI For India 2.0, ChatGPT for Everyone; IBM SkillsBuild Foundations for Understanding AI; TATA Forage GenAI Powered Data Analytics Job Simulation."><title>Certifications: GUVI Python Zero to Hero, Generative AI, AI For India 2.0, ChatGPT for Everyone; IBM SkillsBuild Foundations for Understanding AI; TATA Forage GenAI Powered Data Analytics Job Simulation.</title><style>
.fade{animation:fade 1.1s ease-out backwards}
